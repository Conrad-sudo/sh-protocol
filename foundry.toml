[profile.default]
solc_version = "0.8.33"
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
viaIR = true
gas_reports = ["*"]
remappings= ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
 ,"@account-abstraction/contracts/=lib/account-abstraction/contracts/",
 "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
 "@uniswap/v3-core/=lib/v3-core/",
 "@uniswap/v3-periphery/=lib/v3-periphery/",
 "@uniswap/swap-router-contracts/=lib/swap-router-contracts/"
 ]




fs_permissions = [{ access = "read", path = "./script" }]

[fuzz]
runs=1000
depth=200
fail_on_revert=true

[invariant]
runs   = 500      # number of invariant sequences to run
depth  = 100      # number of calls per sequence
fail_on_revert = false   # handler uses try/catch for expected reverts

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
arbitrum="${ARB_RPC_URL}"
bschain="${BSC_RPC_URL}"
sepolia="${SEPOLIA_RPC_URL}"
base= "${BASE_RPC_URL}"
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
