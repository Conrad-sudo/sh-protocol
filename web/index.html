<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mitfah</title>
    <meta name="description" content="An AI assistant for your crypto wallet that can only spend what you allow." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mitfah" />
    <meta property="og:url" content="https://mitfah.com/" />
    <meta property="og:title" content="Mitfah — an AI assistant for your crypto wallet" />
    <meta property="og:description" content="You own the wallet. You set a daily dollar limit. You can pause it any time." />
    <meta property="og:image" content="https://mitfah.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mitfah: an AI assistant for your crypto wallet that can only spend what you allow." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mitfah — an AI assistant for your crypto wallet" />
    <meta name="twitter:description" content="You own the wallet. You set a daily dollar limit. You can pause it any time." />
    <meta name="twitter:image" content="https://mitfah.com/og.png" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07111F" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      // Dark before first paint. RSuite's CustomProvider sets this class too, but only after React
      // mounts. Mirrors src/theme/themeStore.ts — same key, same rule.
      try {
        var choice = localStorage.getItem('mitfah-theme')
        var dark = choice === 'dark' ||
          (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.body.classList.add('rs-theme-dark')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
