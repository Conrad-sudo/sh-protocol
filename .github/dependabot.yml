# Weekly pull requests for outdated dependencies, so a fixed vulnerability doesn't wait for someone
# to notice. Each ecosystem is grouped into one pull request a week.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The Solidity libraries are git submodules under lib/.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
