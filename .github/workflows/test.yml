name: CI

# Every suite that runs without a live chain, on every push and pull request; the fork suites, which
# need RPC keys, nightly. Actions are pinned to a commit (the tag is in the comment) so a moved tag
# can't change what runs here.

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  FOUNDRY_VERSION: v1.5.1

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Build, with contract sizes
        run: forge build --sizes
      - name: Unit, guard, admin and invariant tests
        run: forge test --no-match-path "test/fork/*" -vv

  slither:
    name: Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # src/ only: the test helpers import the deploy scripts, whose structs Slither can't parse.
      - name: Build src with build info
        run: forge build src --build-info --out slither-out --cache-path slither-cache
      - name: Fail on any high-impact finding
        run: |
          pip install slither-analyzer==0.11.6
          slither . --ignore-compile --foundry-out-directory slither-out \
            --filter-paths "lib/|src/mocks/|src/SafeProxy.sol|src/SessionGrantLib.sol" --fail-high

  python:
    name: Python (offline suites)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The agent's model client is built at import, and refuses to without a key. These suites
      # stub the model and never call it.
      DEEPSEEK_API_KEY: offline-tests-never-call-the-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install, into .venv as the Makefile expects
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt ruff==0.16.10
      # The app reads the contract ABIs from ./out.
      - name: Build the contracts
        run: forge build
      - name: Syntax errors and undefined names
        run: .venv/bin/ruff check --select E9,F63,F7,F82 app
      - name: Offline suites
        run: make py-test

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Reports known vulnerabilities without failing the build until the upgrades in audit.md step
    # 2.2 land; then remove this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  web:
    name: Web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # The build prerenders the public pages in Chromium.
      - run: npx playwright install --with-deps chromium
      - name: Build and prerender
        run: npm run build

  web-e2e:
    name: Web app end-to-end (mocked API)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts the dev server itself (playwright.config.ts). The real-chain specs only run with E2E_REAL.
      - run: npm run e2e

  fork:
    name: Fork tests (${{ matrix.suite }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: SHMainnetUniswapV3Test, rpc: MAINNET_RPC_URL }
          - { suite: SHSepoliaUniswapV3Test, rpc: SEPOLIA_RPC_URL }
          - { suite: SHPancakeswapV2Test, rpc: BSC_RPC_URL }
          - { suite: SHArbitrumUniswapV3Test, rpc: ARB_RPC_URL }
          - { suite: SHBaseUniswapV3Test, rpc: BASE_RPC_URL }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Run against a fork
        env:
          RPC_URL: ${{ secrets[matrix.rpc] }}
        run: |
          if [ -z "$RPC_URL" ]; then
            echo "::notice::The ${{ matrix.rpc }} secret isn't set, so ${{ matrix.suite }} was skipped."
            exit 0
          fi
          # Each suite forks in its own setUp through foundry.toml's [rpc_endpoints], which reads the
          # URL from the variable's real name.
          export "${{ matrix.rpc }}=$RPC_URL"
          forge test --match-path "test/fork/${{ matrix.suite }}.t.sol" -vv
